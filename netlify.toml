# Netlify detects Next.js and applies its Next.js adapter automatically:
# pages are served from the CDN, the two form endpoints run as functions, and
# next/image is handled by Netlify Image CDN.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Practice copies (checklist item 30):
# - Every pull request gets its own preview URL (deploy previews).
# - A `staging` branch can be served at its own URL: Netlify → Site
#   configuration → Build & deploy → Branches and deploy contexts → add
#   `staging` to branch deploys.
# Neither is ever indexed: the build reads CONTEXT and sends noindex headers and
# a closed robots.txt anywhere but production (see next.config.mjs, robots.ts).

# Form delivery (src/lib/delivery.ts). Set these in Netlify → Site configuration
# → Environment variables, scoped to Functions — never in this file and never
# with a NEXT_PUBLIC_ prefix. Until they are set, /api/enquiry and
# /api/subscribe answer { ok: true, delivered: false } and nothing is kept.
#   ENQUIRY_WEBHOOK_URL    https endpoint for journey enquiries
#   SUBSCRIBE_WEBHOOK_URL  https endpoint for circle sign-ups (double opt-in)
#   FORMS_WEBHOOK_SECRET   optional HMAC key → X-Peaks2Shores-Signature header
#
# Rate limiting: the limiter in src/lib/api.ts is in-memory per function
# instance (best effort). For a hard limit add a rate-limit rule for /api/*
# in the Netlify UI.
