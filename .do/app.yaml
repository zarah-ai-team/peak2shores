# DigitalOcean App Platform spec for the Peaks2Shores site.
#
# Create the app from this file (Apps → Create App → "Import from app spec"),
# or with the CLI:  doctl apps create --spec .do/app.yaml
#
# Runs the full Next.js Node server (not a static export): the two form
# endpoints and next/image need it. Deploys on every push to main.
name: peaks2shores
region: nyc

domains:
  - domain: peaks2shores.com
    type: PRIMARY
  - domain: www.peaks2shores.com
    type: ALIAS

services:
  - name: web
    environment_slug: node-js
    github:
      repo: zarah-ai-team/peak2shores
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    # 1 GB is the floor for next/image encoding the large photographs.
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /robots.txt
      initial_delay_seconds: 20
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      # Form delivery (src/lib/delivery.ts). Add these in the App Platform UI
      # as encrypted values; until then the forms accept but deliver nothing.
      #   ENQUIRY_WEBHOOK_URL, SUBSCRIBE_WEBHOOK_URL, FORMS_WEBHOOK_SECRET
