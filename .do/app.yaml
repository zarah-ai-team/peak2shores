# DigitalOcean App Platform spec for the Peaks2Shores site, as a static site
# (the free tier): plain files built by `npm run build:static`, no server.
#
# Create the app from this file (Apps → Create App → "Import from app spec"),
# or with the CLI:  doctl apps create --spec .do/app.yaml
#
# What the static build gives up, and what stands in for it, is described at
# the top of scripts/build-static.mjs. Deploys on every push to main.
name: peaks2shores
region: nyc

domains:
  - domain: peaks2shores.com
    type: PRIMARY
  - domain: www.peaks2shores.com
    type: ALIAS

static_sites:
  - name: web
    environment_slug: node-js
    github:
      repo: zarah-ai-team/peak2shores
      branch: main
      deploy_on_push: true
    build_command: npm run build:static
    output_dir: out
    index_document: index.html
    error_document: 404.html
