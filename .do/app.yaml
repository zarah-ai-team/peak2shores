# DigitalOcean App Platform spec for peaks2shores.com as a static site (the
# free tier): plain files, no server. Deploys on every push to main.
#
# Create the app from this file (Apps → Create App → "Import from app spec"),
# or with the CLI:  doctl apps create --spec .do/app.yaml
#
# For now the site is only the Journey Book (scripts/build-flipbook.mjs), with
# every other address falling back to it. To launch the full site as static
# files instead, change two lines below:
#   build_command: npm run build:static
#   error_document: 404.html        (in place of catchall_document)
name: peaks2shores
region: nyc

domains:
  - domain: peaks2shores.com
    type: PRIMARY
  - domain: www.peaks2shores.com
    type: ALIAS

static_sites:
  - name: web
    environment_slug: node-js
    github:
      repo: zarah-ai-team/peak2shores
      branch: main
      deploy_on_push: true
    build_command: npm run build:flipbook
    output_dir: out
    index_document: index.html
    catchall_document: index.html
